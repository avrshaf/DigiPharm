<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DigiPharm - Checkout</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --primary-blue: #a4bdf6; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: white; padding-bottom: 50px; }

        .navbar { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 23px 8%; background: white; border-bottom: 1px solid #eee;
            position: sticky; top: 0; z-index: 1000;
        }
        .logo img { height: 35px; }
        .nav-links { display: flex; gap: 40px; position: absolute; left: 50%; transform: translateX(-50%); }
        .nav-links a { text-decoration: none; color: #000; font-weight: 600; font-size: 0.95rem; }
        .cart-icon { font-size: 1.3rem; color: black; position: relative; text-decoration: none; }
        .badge { position: absolute; top: -10px; right: -10px; background: red; color: white; font-size: 0.7rem; padding: 2px 6px; border-radius: 50%; font-weight: 800; }

        .header-blue { background-color: var(--primary-blue); padding: 50px 8%; }
        .header-blue h1 { font-weight: 800; font-size: 3rem; }

        .checkout-container { padding: 40px 8%; max-width: 1200px; margin: 0 auto; }
        .section-box { background: var(--primary-blue); border-radius: 15px; padding: 30px; margin-bottom: 30px; }
        .section-title { font-weight: 800; font-size: 1.2rem; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }

        .summary-item { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 8px; }
        .summary-total { display: flex; justify-content: space-between; font-weight: 800; font-size: 1.4rem; border-top: 2px solid #555; pt: 10px; }

        .delivery-options { display: flex; gap: 20px; margin-bottom: 25px; }
        .method-card { 
            flex: 1; background: white; border-radius: 12px; padding: 20px; 
            display: flex; align-items: center; gap: 15px; cursor: pointer;
            border: 4px solid transparent; transition: 0.2s;
        }
        .method-card.active { border-color: black; }
        .method-card i { font-size: 1.8rem; }

        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-weight: 800; margin-bottom: 8px; }
        .input-group input, .input-group textarea { width: 100%; border-radius: 10px; border: none; padding: 15px; font-weight: 600; }

        .place-order-btn { background: black; color: white; border: none; width: 100%; padding: 20px; border-radius: 12px; font-weight: 800; font-size: 1.2rem; cursor: pointer; }

        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 2000; }
        .modal-content { background: white; padding: 40px; border-radius: 20px; text-align: center; }
        .btn-pay { background: #28a745; color: white; border: none; padding: 15px 30px; border-radius: 12px; font-weight: 800; cursor: pointer; width: 100%; margin-top: 20px; }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="logo"><img src="logo_utama.png" alt="Logo"></div>
        <nav class="nav-links">
            <a href="catalog.html">Medications</a>
            <a href="facilities.html">Nearest Health Facility</a>
            <a href="tracking.html">Orders</a>
            <a href="about.html">About</a>
        </nav>
        <a href="cart.html" class="cart-icon"><i class="fa-solid fa-cart-shopping"></i><span class="badge" id="cart-badge">0</span></a>
    </header>

    <div class="header-blue">
        <h1>Check Out</h1>
    </div>

    <div class="checkout-container">
        <div class="section-box">
            <div class="section-title"><i class="fa-solid fa-box"></i> Order Summary</div>
            <div id="summary-items"></div>
            <div class="summary-total"><span>Total</span><span id="final-price">IDR 0</span></div>
        </div>

        <div class="section-box">
            <div class="section-title"><i class="fa-solid fa-truck"></i> Delivery Method</div>
            <div class="delivery-options">
                <div id="btn-pickup" class="method-card active" onclick="setMethod('Pickup')">
                    <i class="fa-solid fa-shop"></i>
                    <div><h4>Picked up</h4><p>Collect at pharmacy</p></div>
                </div>
                <div id="btn-delivery" class="method-card" onclick="setMethod('Home Delivery')">
                    <i class="fa-solid fa-truck-fast"></i>
                    <div><h4>Delivery</h4><p>To your address</p></div>
                </div>
            </div>

            <div class="input-group"><label>Full Name</label><input type="text" id="user-name"></div>
            <div class="input-group"><label>Phone Number</label><input type="number" id="user-phone"></div>
            <div class="input-group" id="address-field" style="display: none;"><label>Address</label><textarea id="user-address"></textarea></div>
        </div>

        <button class="place-order-btn" onclick="openQRIS()">Place Order</button>
    </div>

    <div class="modal" id="qrisModal">
        <div class="modal-content">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=PAY" alt="QRIS">
            <button class="btn-pay" onclick="finishOrder()">I have paid</button>
        </div>
    </div>

    <script>
        let selectedMethod = 'Pickup'; 

        function setMethod(m) {
            selectedMethod = m;
            document.getElementById('btn-pickup').classList.toggle('active', m === 'Pickup');
            document.getElementById('btn-delivery').classList.toggle('active', m === 'Home Delivery');
            document.getElementById('address-field').style.display = (m === 'Home Delivery') ? 'block' : 'none';
        }

        function render() {
            const cart = JSON.parse(localStorage.getItem('digipharm_cart')) || [];
            let total = 0;
            document.getElementById('summary-items').innerHTML = cart.map(item => {
                total += (10000 * item.qty);
                return `<div class="summary-item"><span>${item.qty}x ${item.id}</span><span>IDR ${(10000 * item.qty).toLocaleString()}</span></div>`;
            }).join('');
            document.getElementById('final-price').innerText = "IDR " + total.toLocaleString();
            document.getElementById('cart-badge').innerText = cart.length;
        }

        function openQRIS() { document.getElementById('qrisModal').style.display = 'flex'; }

        function finishOrder() {
            let cart = JSON.parse(localStorage.getItem('digipharm_cart')) || [];
            let history = JSON.parse(localStorage.getItem('digipharm_history')) || [];
            
            const newOrder = {
                id: "ORD-" + Math.floor(Math.random() * 900000),
                date: new Date().toLocaleString(),
                total: cart.reduce((s, i) => s + (10000 * i.qty), 0),
                items: [...cart],
                deliveryMethod: selectedMethod, 
                address: selectedMethod === 'Home Delivery' ? document.getElementById('user-address').value : 'Pickup at Pharmacy'
            };

            history.push(newOrder);
            localStorage.setItem('digipharm_history', JSON.stringify(history));
            localStorage.removeItem('digipharm_cart');
            window.location.href = 'tracking.html';
        }
        window.onload = render;
    </script>
</body>
</html>
