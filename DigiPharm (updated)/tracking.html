<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DigiPharm - Order Tracking</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --primary-blue: #a4bdf6; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: white; padding-bottom: 50px; }

        .navbar { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 23px 8%; background: white; border-bottom: 1px solid #eee;
            position: sticky; top: 0; z-index: 1000;
        }
        .logo img { height: 35px; }
        .nav-links { display: flex; gap: 40px; position: absolute; left: 50%; transform: translateX(-50%); }
        .nav-links a { text-decoration: none; color: #000; font-weight: 600; font-size: 0.95rem; }
        .cart-icon { font-size: 1.3rem; color: black; text-decoration: none; }

        .header-blue { 
            background-color: var(--primary-blue); padding: 60px 8%; 
            display: flex; justify-content: space-between; align-items: center; 
        }
        .header-left { display: flex; align-items: center; gap: 20px; }
        .header-left i { font-size: 3.5rem; }
        .header-left h1 { font-weight: 800; font-size: 2.8rem; }
        .header-blue p { text-align: right; font-weight: 600; max-width: 300px; }

        .tracking-container { padding: 40px 8%; max-width: 1000px; margin: 0 auto; }
        .order-group { margin-bottom: 50px; }
        .order-meta { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 15px; }
        .main-box { border: 8px solid var(--primary-blue); border-radius: 12px; overflow: hidden; background: white; }
        .status-box { padding: 40px; border-bottom: 8px solid var(--primary-blue); }
        
        .timeline { margin: 25px 0; border-left: 3px solid #ddd; padding-left: 20px; }
        .time-item { margin-bottom: 15px; position: relative; }
        .time-item::before { content: ''; position: absolute; left: -26px; top: 5px; width: 10px; height: 10px; background: #ddd; border-radius: 50%; }
        .time-item.active::before { background: var(--primary-blue); box-shadow: 0 0 8px var(--primary-blue); }

        .items-list { padding: 40px; }
        .item-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .item-left { display: flex; align-items: center; gap: 20px; }
        .item-left img { width: 80px; height: 80px; border-radius: 12px; object-fit: cover; }
        
        .btn-collected { 
            background: #28a745; color: white; border: none; padding: 12px 25px; 
            border-radius: 10px; font-weight: 800; cursor: pointer; 
            display: none; 
        }
        .btn-collected:hover { background: #218838; }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="logo"><img src="logo_utama.png" alt="Logo"></div>
        <nav class="nav-links">
            <a href="catalog.html">Medications</a>
            <a href="facilities.html">Nearest Health Facility</a>
            <a href="tracking.html" style="color:var(--primary-blue)">Orders</a>
            <a href="about.html">About</a>
        </nav>
        <a href="cart.html" class="cart-icon"><i class="fa-solid fa-cart-shopping"></i></a>
    </header>

    <div class="header-blue">
        <div class="header-left">
            <i class="fa-solid fa-box-open"></i>
            <h1>Order Tracking</h1>
        </div>
        <p>Monitor your orders in real-time</p>
    </div>

    <div class="tracking-container" id="list"></div>

    <script>
        // Database acuan harga agar sesuai dengan katalog utama dan keranjang
        const medicinesMaster = [
            { name: 'Paracetamol', price: 10000 },
            { name: 'Ibuprofen', price: 15000 },
            { name: 'Mefenamic Acid', price: 12000 },
            { name: 'Cetirizine', price: 20000 },
            { name: 'Guaifenesin', price: 8000 },
            { name: 'Dextromethorphan', price: 10000 },
            { name: 'Amoxicillin', price: 25000 },
            { name: 'Vitamin C', price: 30000 },
            { name: 'Loratadine', price: 18000 },
            { name: 'Omeprazole', price: 22000 },
            { name: 'Promag', price: 8000 },
            { name: 'Panadol Extra', price: 12000 }
        ];

        function render() {
            const history = JSON.parse(localStorage.getItem('digipharm_history')) || [];
            const container = document.getElementById('list');

            if (history.length === 0) {
                container.innerHTML = "<h3 style='text-align:center; margin-top:50px; color:#999;'>No active orders.</h3>";
                return;
            }

            container.innerHTML = history.map((order, idx) => {
                // Membaca status dinamis dari localStorage (Default: Packing)
                const currentStatus = order.status || 'Packing';
                
                // Menentukan aktivasi visual titik timeline berdasarkan status saat ini
                const isDispatchedActive = (currentStatus === 'Medicine Dispatched' || currentStatus === 'Ready for Collection');
                const isReadyActive = (currentStatus === 'Ready for Collection');

                return `
                <div class="order-group">
                    <div class="order-meta">
                        <div>
                            <h2 style="font-weight:800">${order.id}</h2>
                            <p style="font-size:0.85rem; color:#666; font-weight:600;">${order.date}</p>
                        </div>
                        <div style="text-align:right; font-weight:800; font-size:1.4rem;">
                            IDR ${order.total.toLocaleString('id-ID')}
                        </div>
                    </div>
                    <div class="main-box">
                        <div class="status-box">
                            <h2 style="font-weight:800; font-size:2rem;">${currentStatus}</h2>
                            <div class="timeline">
                                <div class="time-item active">
                                    <h4>Order placed</h4>
                                    <p>${order.date}</p>
                                </div>
                                <div class="time-item ${isDispatchedActive ? 'active' : ''}">
                                    <h4>Medicine Dispatched</h4>
                                    <p>${isDispatchedActive ? 'Out for delivery / Dispatched' : 'In progress...'}</p>
                                </div>
                                <div class="time-item ${isReadyActive ? 'active' : ''}">
                                    <h4>Ready</h4>
                                    <p>${isReadyActive ? 'Your order is ready!' : 'Pending'}</p>
                                </div>
                            </div>
                            <div style="font-weight:800; display:flex; align-items:center; gap:10px;">
                                <i class="fa-solid fa-location-dot"></i> 
                                ${order.deliveryMethod || 'Pickup at Pharmacy'} 
                            </div>
                        </div>
                        <div class="items-list">
                            ${order.items.map(item => {
                                let match = medicinesMaster.find(m => m.name.toLowerCase() === item.id.toLowerCase());
                                let price = match ? match.price : 10000;
                                return `
                                <div class="item-row">
                                    <div class="item-left">
                                        <img src="https://www.icapsulepack.com/wp-content/uploads/2023/04/Drug-and-Medicine-2.jpg">
                                        <div>
                                            <h4 style="font-weight:800; text-transform:capitalize;">${item.id}</h4>
                                            <p>Qty: ${item.qty}</p>
                                        </div>
                                    </div>
                                    <div style="font-weight:800;">IDR ${(price * item.qty).toLocaleString('id-ID')}</div>
                                </div>`;
                            }).join('')}
                            
                            <button class="btn-collected" id="btn-${idx}" style="display: ${isReadyActive ? 'block' : 'none'};" onclick="remove(${idx})">
                                Order Collected
                            </button>
                        </div>
                    </div>
                </div>
                `;
            }).reverse().join('');
        }

        function remove(idx) {
            let history = JSON.parse(localStorage.getItem('digipharm_history'));
            history.splice(history.length - 1 - idx, 1);
            localStorage.setItem('digipharm_history', JSON.stringify(history));
            render();
        }

        window.onload = render;

        // Mendengarkan perubahan localStorage dari tab/halaman admin agar langsung render otomatis tanpa reload
        window.addEventListener('storage', render);
    </script>
</body>
</html>
