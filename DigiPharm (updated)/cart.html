<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DigiPharm - Shopping Cart</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { --primary-blue: #a4bdf6; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: white; }

        /* NAVBAR SINKRON & KETENGAH */
        .navbar { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 23px 8%; background: white; border-bottom: 1px solid #eee;
            position: sticky; top: 0; z-index: 1000;
        }
        .logo img { height: 35px; }
        .nav-links { display: flex; gap: 40px; position: absolute; left: 50%; transform: translateX(-50%); }
        .nav-links a { text-decoration: none; color: #000; font-weight: 600; font-size: 0.95rem; }
        .cart-icon { font-size: 1.3rem; color: black; text-decoration: none; position: relative; }
        .badge { position: absolute; top: -10px; right: -10px; background: red; color: white; font-size: 0.7rem; padding: 2px 6px; border-radius: 50%; font-weight: 800; display: none; }

        /* BLUE HEADER */
        .header-blue { 
            background-color: var(--primary-blue); padding: 60px 8%; 
            display: flex; justify-content: space-between; align-items: center; 
        }
        .header-left { display: flex; align-items: center; gap: 20px; }
        .header-left i { font-size: 3.5rem; }
        .header-left h1 { font-weight: 800; font-size: 2.8rem; }
        .header-blue p { text-align: right; font-weight: 600; max-width: 300px; }

        /* CART CONTAINER */
        .cart-container { padding: 50px 8%; display: flex; gap: 50px; max-width: 1400px; margin: 0 auto; }
        .cart-items { flex: 2; }
        .cart-summary { flex: 1; border: 8px solid var(--primary-blue); border-radius: 20px; padding: 30px; height: fit-content; }

        .cart-item { display: flex; align-items: center; padding: 20px 0; border-bottom: 2px solid #eee; }
        .item-img { width: 100px; height: 100px; border-radius: 15px; object-fit: cover; margin-right: 20px; }
        .item-details { flex-grow: 1; }
        .item-details h3 { font-weight: 800; font-size: 1.3rem; }
        .item-details p { font-weight: 600; color: #666; margin-top: 5px; }

        .qty-controls { display: flex; align-items: center; gap: 15px; border: 4px solid var(--primary-blue); padding: 5px 15px; border-radius: 12px; }
        .qty-btn { background: none; border: none; font-size: 1.2rem; font-weight: 800; cursor: pointer; }
        .qty-controls span { font-weight: 800; font-size: 1.1rem; min-width: 20px; text-align: center; }

        .summary-row { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .btn-checkout { width: 100%; background: black; color: white; border: none; padding: 15px; border-radius: 12px; font-weight: 800; font-size: 1.1rem; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="logo"><a href="index.html"><img src="logo_utama.png" alt="Logo"></a></div>
        <nav class="nav-links">
            <a href="catalog.html">Medications</a>
            <a href="facilities.html">Nearest Health Facility</a>
            <a href="tracking.html">Orders</a>
            <a href="about.html">About</a>
        </nav>
        <a href="cart.html" class="cart-icon"><i class="fa-solid fa-cart-shopping"></i><span id="nav-badge" class="badge">0</span></a>
    </header>

    <div class="header-blue">
        <div class="header-left">
            <i class="fa-solid fa-cart-shopping"></i>
            <h1>Shopping Cart</h1>
        </div>
        <p>Review your items before proceeding to checkout</p>
    </div>

    <div class="cart-container">
        <div class="cart-items" id="cart-list"></div>
        <div class="cart-summary">
            <h2 style="font-weight: 800; margin-bottom: 25px;">Order Summary</h2>
            <div class="summary-row">
                <span style="font-weight: 600; color:#666;">Items (<span id="qty-count">0</span>)</span>
                <span style="font-weight: 800;" id="total-price">IDR 0</span>
            </div>
            <div class="summary-row" style="border-top: 2px dashed #ddd; padding-top: 20px;">
                <span style="font-weight: 800; font-size: 1.2rem;">Total Payment</span>
                <span style="font-weight: 800; font-size: 1.2rem; color: var(--primary-blue);" id="total-payment">IDR 0</span>
            </div>
            <button class="btn-checkout" onclick="goToCheckout()">Checkout</button>
        </div>
    </div>

    <script>
        const MASTER_IMAGE = "https://www.icapsulepack.com/wp-content/uploads/2023/04/Drug-and-Medicine-2.jpg";

        const medicines = [
            { id: 'paracetamol', name: 'Paracetamol', price: 10000 },
            { id: 'ibuprofen', name: 'Ibuprofen', price: 15000 },
            { id: 'mefenamic', name: 'Mefenamic Acid', price: 12000 },
            { id: 'cetirizine', name: 'Cetirizine', price: 20000 },
            { id: 'guaifenesin', name: 'Guaifenesin', price: 8000 },
            { id: 'dextro', name: 'Dextromethorphan', price: 10000 },
            { id: 'amoxicillin', name: 'Amoxicillin', price: 25000 },
            { id: 'vitaminc', name: 'Vitamin C', price: 30000 },
            { id: 'loratadine', name: 'Loratadine', price: 18000 },
            { id: 'omeprazole', name: 'Omeprazole', price: 22000 },
            { id: 'promag', name: 'Promag', price: 8000 },
            { id: 'panadolextra', name: 'Panadol Extra', price: 12000 }
        ];

        function renderCart() {
            let cart = JSON.parse(localStorage.getItem('digipharm_cart')) || [];
            const listContainer = document.getElementById('cart-list');

            if (cart.length === 0) {
                listContainer.innerHTML = "<h3 style='text-align:center; color:#999; margin-top: 30px;'>Your cart is empty.</h3>";
                document.getElementById('total-price').innerText = "IDR 0";
                document.getElementById('total-payment').innerText = "IDR 0";
                document.getElementById('qty-count').innerText = "0";
                updateNavBadge(0);
                return;
            }

            let total = 0;
            let qtyCount = 0;

            listContainer.innerHTML = cart.map((item, i) => {
                // Gunakan toLowerCase agar pencarian nama item dari katalog fleksibel & akurat
                let medInfo = medicines.find(m => m.name.toLowerCase() === item.id.toLowerCase());
                let harga = medInfo ? medInfo.price : 10000; 
                let subtotal = harga * item.qty;
                
                total += subtotal;
                qtyCount += item.qty;

                return `
                <div class="cart-item">
                    <img src="${MASTER_IMAGE}" class="item-img" onerror="this.src='logo_utama.png'">
                    <div class="item-details">
                        <h3>${item.id}</h3>
                        <p>IDR ${harga.toLocaleString()}</p>
                    </div>
                    <div class="qty-controls">
                        <button class="qty-btn" onclick="updateQty(${i}, -1)">-</button>
                        <span>${item.qty}</span>
                        <button class="qty-btn" onclick="updateQty(${i}, 1)">+</button>
                    </div>
                    <i class="fa-solid fa-trash" style="cursor:pointer; margin-left:25px; color:#ff4d4d; font-size:1.2rem;" onclick="updateQty(${i}, -${item.qty})"></i>
                </div>`;
            }).join('');

            document.getElementById('total-price').innerText = "IDR " + total.toLocaleString();
            document.getElementById('total-payment').innerText = "IDR " + total.toLocaleString();
            document.getElementById('qty-count').innerText = qtyCount;
            updateNavBadge(qtyCount);
        }

        function updateQty(index, delta) {
            let cart = JSON.parse(localStorage.getItem('digipharm_cart')) || [];
            cart[index].qty += delta;
            if (cart[index].qty < 1) {
                cart.splice(index, 1);
            }
            localStorage.setItem('digipharm_cart', JSON.stringify(cart));
            renderCart();
        }

        function updateNavBadge(totalQty) {
            const badge = document.getElementById('nav-badge');
            if (badge) {
                badge.innerText = totalQty;
                badge.style.display = totalQty > 0 ? 'block' : 'none';
            }
        }

        function goToCheckout() {
            let cart = JSON.parse(localStorage.getItem('digipharm_cart')) || [];
            if (cart.length === 0) {
                alert("Cart is empty! Please add some medications first.");
                return;
            }
            window.location.href = 'checkout.html';
        }

        window.onload = renderCart;
    </script>
</body>
</html>
